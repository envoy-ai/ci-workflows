name: Release Gate

# A promotion PR into production must carry a release-please version bump:
# the manifest version on the PR head has to differ from the one on the
# base. Only promotion PRs (head = staging) are checked; hotfix PRs from a
# feature branch skip the job, which counts as passing.

on:
  workflow_call:
    inputs:
      manifest-file:
        description: "Path to .release-please-manifest.json"
        required: false
        type: string
        default: ".release-please-manifest.json"
      promotion-head:
        description: "Head branch of promotion PRs; other heads skip the check"
        required: false
        type: string
        default: "staging"

jobs:
  release-cut:
    name: Release cut
    if: ${{ github.head_ref == inputs.promotion-head }}
    runs-on: ubuntu-latest
    steps:
      - name: Compare manifest versions on base and head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MANIFEST: ${{ inputs.manifest-file }}
        run: |
          version() {
            gh api "repos/${REPO}/contents/${MANIFEST}?ref=$1" --jq '.content' \
              | base64 -d | jq -r '."."'
          }
          base=$(version "$BASE_SHA")
          head=$(version "$HEAD_SHA")
          echo "${BASE_REF}=${base} ${HEAD_REF}=${head}"
          if [ "$base" = "$head" ]; then
            echo "::error::No release cut since ${BASE_REF} (version ${base} on both sides). Merge the open release-please PR into development and promote it to ${HEAD_REF} first."
            exit 1
          fi
          echo "Release cut: ${base} -> ${head}"
